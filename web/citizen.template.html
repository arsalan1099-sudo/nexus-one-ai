<div class="chat-app" id="citizenWorkspace">
  <header class="chat-topbar">
    <button type="button" class="menu-button" id="menuToggle" aria-label="Open tools menu">☰</button>
    <div class="chat-brand">NEXUS ONE <span>Preview</span></div>
    <button type="button" class="new-chat" id="newChat">＋ New</button>
  </header>
  <aside class="chat-drawer" id="toolDrawer" hidden>
    <div class="drawer-title">Tools</div>
    <nav data-citizen-nav aria-label="Choose a tool"></nav>
    <p class="drawer-note">Offline tools only. AI chat is not connected yet.</p>
  </aside>
  <main class="chat-main">
    <section class="chat-welcome" id="welcome">
      <div class="welcome-mark">N</div>
      <h1>What can I help with?</h1>
      <p>Choose a tool below to get started.</p>
      <div class="quick-tools" id="quickTools"></div>
    </section>
    <section class="chat-thread" id="chatThread" aria-live="polite" hidden></section>
    <form class="chat-composer" data-citizen-form autocomplete="off">
      <div class="selected-tool"><span data-citizen-title>Smart Budget</span><button type="button" id="changeTool">Change</button></div>
      <div class="chat-fields" data-citizen-fields></div>
      <div class="composer-bottom">
        <span>Private · Calculations stay on this device</span>
        <button class="send-button" type="submit" aria-label="Run tool">↑</button>
      </div>
    </form>
    <p class="chat-disclaimer">NEXUS Citizen is an offline toolkit, not an AI chatbot. Results are decision-support only.</p>
    <div hidden><div data-citizen-output></div><div data-citizen-readonly hidden><button type="button" data-citizen-copy>Copy summary</button><button type="button" data-citizen-export>Export JSON</button></div><button type="button" data-citizen-reset>Reset</button><p data-citizen-status></p></div>
  </main>
</div><script>/* CITIZEN_JS */</script></body></html>
