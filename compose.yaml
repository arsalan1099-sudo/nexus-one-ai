services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    secrets:
      - firebase-admin
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - quota-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  quota-data:
secrets:
  firebase-admin:
    file: ./secrets/firebase-admin.json
