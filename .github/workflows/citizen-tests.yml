name: Citizen regression tests
on:
  push:
    branches: [main, fix/citizen-production-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  citizen-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run offline calculator regression tests
        run: node --test tests/citizen.test.mjs
